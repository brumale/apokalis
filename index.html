#gl{position:absolute;inset:0;width:100%;height:100%;display:block;background:#020202;z-index:1;transition:opacity 7s ease}
body.logo-settled #gl,body.logo-settled #bevel{opacity:0}
#bevel{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:2;
  overflow:visible;
  transition:opacity 7s ease;
}
.bevel-shadow{opacity:0.0918;mix-blend-mode:multiply}
.bevel-inner-shadow{opacity:0.06885;mix-blend-mode:multiply}
.bevel-spec{opacity:.03825}
.bevel-fill{opacity:0.2754;filter:blur(12px);mix-blend-mode:screen}
.bevel-depth{opacity:0.14535;filter:blur(14px);mix-blend-mode:multiply}
.bevel-blobA,.bevel-blobB,.bevel-blobC{mix-blend-mode:screen;filter:blur(28px)}
.bevel-blobA{opacity:.0765}
.bevel-blobB{opacity:.0612}
.bevel-blobC{opacity:.042075}

#logo-wrap{transition:top 1.2s cubic-bezier(.2,.7,.2,1),left 1.2s cubic-bezier(.2,.7,.2,1),width 1.2s cubic-bezier(.2,.7,.2,1),transform 1.2s cubic-bezier(.2,.7,.2,1);will-change:top,left,width,transform}
body.logo-settling #logo-wrap{top:clamp(52px,6.7vw,95px);left:50%;width:clamp(180px,22vw,280px);transform:translate(-50%,-50%)}
body.player-active #logo-wrap{top:36px;left:50%;width:clamp(105px,11vw,145px);transform:translate(-50%,-50%);cursor:pointer;transition-duration:.8s}
body.intro-complete #logo-wrap{transition-duration:.8s}
body.player-active #logo-wrap:focus-visible{outline:2px solid #fff;outline-offset:6px}
#gallery{position:fixed;inset:0;z-index:1;overflow:auto;overscroll-behavior:contain;background:#080808;opacity:0;visibility:hidden;transition:opacity 1.5s ease,visibility 0s linear 1.5s}
body.gallery-revealed #gallery{opacity:1;visibility:visible;transition-delay:0s}
.gallery-inner{width:min(100%,1660px);min-height:100%;margin:auto;padding:clamp(24px,3.5vw,54px)}
.gallery-header{height:clamp(52px,6.35vw,81px);margin-bottom:clamp(30px,4vw,58px)}
.gallery-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:4px;grid-auto-flow:row;align-items:start;gap:12px}
.film{display:block;width:100%;margin:0;padding:0;overflow:hidden;border:1px solid #303030;border-radius:0;background:#111;cursor:pointer;line-height:0}
.film img{display:block;width:100%;height:auto;opacity:1;filter:none;transition:transform 1.4s ease-out}
.gallery-grid:not(.has-appeared) .film{opacity:0}
.gallery-grid.is-resetting{opacity:1;transition:none}
.gallery-grid.is-resetting .film{opacity:0!important;animation:none!important;transition:none!important}
.gallery-grid.is-leaving{opacity:0;transition:opacity .45s ease}
.gallery-grid.is-appearing .film{animation:film-emerge 1.2s cubic-bezier(.18,.7,.2,1) both;animation-delay:calc(var(--order) * 240ms)}
@keyframes film-emerge{from{opacity:0;transform:translate3d(0,35px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@media(hover:hover) and (pointer:fine){.film:hover img{transform:scale(1.025)}}
.film:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(pointer:coarse){.film:focus-visible,body.player-active #logo-wrap:focus-visible{outline:none}}
#player-stage{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:#000;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .5s ease,visibility 0s linear .5s}
#player-stage.is-open{visibility:visible;opacity:1;pointer-events:auto;transition-delay:0s}
#player-stage.is-closing{visibility:hidden;opacity:0;pointer-events:none;transition:none}
.player-bar{position:relative;flex:none;height:72px;background:#000}
.release-links{position:absolute;z-index:1;top:50%;right:clamp(16px,3.5vw,54px);display:flex;gap:7px;transform:translate(-8px,-50%);opacity:0;pointer-events:none;transition:opacity 1.4s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.release-links.is-visible{transform:translate(0,-50%);opacity:1;pointer-events:auto}
.release-link{display:grid;width:34px;height:34px;place-items:center;color:#fff;opacity:.62;text-decoration:none;transition:opacity .3s ease,transform .3s ease;-webkit-tap-highlight-color:transparent}
.release-link svg{display:block;width:20px;height:20px;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.release-link:hover{opacity:1;transform:scale(1.07)}
.release-link:focus-visible{outline:1px solid #fff;outline-offset:1px;opacity:1}
.player-frame{position:relative;flex:1;min-height:0;overflow:hidden}
#video-player{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;visibility:hidden;opacity:0;filter:brightness(1);pointer-events:none;transition:opacity 1s ease,filter 1s ease}
#video-player.is-ready{visibility:visible;opacity:1;pointer-events:auto}
#video-player.is-ready.awaiting-play{opacity:.78;filter:brightness(.82);pointer-events:none}
.play-button{position:absolute;z-index:3;inset:0;display:grid;width:100%;height:100%;padding:0;border:0;background:transparent;color:#fff;font:inherit;opacity:0;visibility:hidden;pointer-events:none;cursor:pointer;place-items:center;-webkit-tap-highlight-color:transparent}
.play-button.is-visible{opacity:1;visibility:visible;pointer-events:auto}
.play-pill{display:grid;width:86px;height:86px;border:1px solid rgba(255,255,255,.58);border-radius:50%;background:rgba(0,0,0,.68);transform:translateY(8%) scale(.96);box-shadow:0 10px 35px rgba(0,0,0,.32);backdrop-filter:blur(8px);place-items:center;animation:play-pulse 3.6s ease-in-out infinite;transition:transform .9s cubic-bezier(.2,.7,.2,1),border-color .3s ease,background-color .3s ease}
.play-button.is-visible .play-pill{transform:translateY(0) scale(1)}
.play-button:hover .play-pill,.play-button:focus-visible .play-pill{filter:brightness(1.18)}
.play-button:focus-visible{outline:1px solid rgba(255,255,255,.7);outline-offset:-3px}
.play-icon{display:block;width:48px;height:48px;overflow:visible}
.play-triangle{fill:currentColor}
@keyframes play-pulse{0%,100%{border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.62);box-shadow:0 10px 35px rgba(0,0,0,.3)}50%{border-color:rgba(255,255,255,.9);background:rgba(12,12,12,.82);box-shadow:0 10px 42px rgba(255,255,255,.12)}}
.loading-indicator{position:absolute;inset:0;z-index:2;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s ease}
.loading-indicator.is-visible{opacity:1}
.loading-indicator.has-error{pointer-events:auto}
.loading-spinner{display:block;width:34px;height:34px;border:2px solid #4a4a4a;border-top-color:#fff;border-radius:50%;animation:spinner-turn .8s linear infinite}
.loading-indicator.has-error .loading-spinner{display:none}
.loading-error{display:none;color:#fff;font-size:13px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:4px}
.loading-indicator.has-error .loading-error{display:block}
@keyframes spinner-turn{to{transform:rotate(360deg)}}
.launch-image{position:fixed;z-index:1;display:block;object-fit:contain;pointer-events:none;transform-origin:top left;backface-visibility:hidden;will-change:transform,opacity}
@media(min-width:1700px){.gallery-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:1200px){.gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gallery-inner{padding:24px 12px}.gallery-header{height:52px;margin-bottom:26px}body.logo-settling #logo-wrap{top:50px}body.player-active #logo-wrap{top:32px;width:108px}#player-stage{height:100dvh}.player-bar{height:64px}.play-pill{width:80px;height:80px}.release-links{right:8px;gap:3px}.release-link{width:32px;height:32px}.release-link svg{width:19px;height:19px}}
@media(max-width:380px){.gallery-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#gallery,#logo-wrap,#gl,#bevel,#player-stage,.gallery-grid,.film img,.loading-indicator,.play-button,.play-pill,.release-links,.release-link,#video-player{transition-duration:.01ms!important;transition-delay:0s!important}.gallery-grid.is-appearing .film{animation-duration:.01ms!important;animation-delay:0s!important}.loading-spinner,.play-pill{animation:none!important}}
</style>
</head>

function makeShader(type, source){
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);

  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const message = gl.getShaderInfoLog(shader) || 'Shader compilation failed';
    gl.deleteShader(shader);
    throw new Error(message);
  }

  return shader;
}

function makeProgram(fragmentSource){
  const vertexShader = makeShader(gl.VERTEX_SHADER, vertexSrc);
  const fragmentShader = makeShader(gl.FRAGMENT_SHADER, fragmentSource);
  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const message = gl.getProgramInfoLog(program) || 'Program linking failed';
    gl.deleteProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
    throw new Error(message);
  }

  gl.detachShader(program, vertexShader);
  gl.detachShader(program, fragmentShader);
  gl.deleteShader(vertexShader);
  gl.deleteShader(fragmentShader);

  return program;
}

  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
}

const simUPrev = gl.getUniformLocation(simProgram, 'uPrev');
const simUSimRes = gl.getUniformLocation(simProgram, 'uSimRes');
const simUTime = gl.getUniformLocation(simProgram, 'uTime');

const uRes = gl.getUniformLocation(renderProgram, 'uRes');
const uTime = gl.getUniformLocation(renderProgram, 'uTime');
const uFluid = gl.getUniformLocation(renderProgram, 'uFluid');

const SIM_W = 512;
const SIM_H = 148;

function rand01(){
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    return arr[0] / 4294967296;
  }
  return Math.random();
}

const sessionSeed = rand01() * 1000.0;
const startTimeOffset = rand01() * 360.0;
const prewarmSteps = 10 + Math.floor(rand01() * 28.0);
const prewarmStepSize = 0.041 + rand01() * 0.035;
const fluidSeedA = 11.0 + sessionSeed * 0.73;
const fluidSeedB = 37.0 + sessionSeed * 1.91;

function makeFluidTexture(seed){
  const data = new Uint8Array(SIM_W * SIM_H * 4);
  for (let y = 0; y < SIM_H; y++) {
    for (let x = 0; x < SIM_W; x++) {
      const i = (y * SIM_W + x) * 4;
      const raw = Math.sin((x + seed) * 12.9898 + (y - seed) * 78.233) * 43758.5453;
      const n = raw - Math.floor(raw);
      const v = Math.floor((0.42 + 0.16 * n) * 255);
      data[i + 0] = v;
      data[i + 1] = 128;
      data[i + 2] = v;
      data[i + 3] = 255;
    }
  }

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIM_W, SIM_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return tex;
}

function makeFramebuffer(tex){
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return fb;
}

const fluidTex = [makeFluidTexture(fluidSeedA), makeFluidTexture(fluidSeedB)];
const fluidFbo = [makeFramebuffer(fluidTex[0]), makeFramebuffer(fluidTex[1])];

gl.bindFramebuffer(gl.FRAMEBUFFER, fluidFbo[0]);
const fluidFbo0OK = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
gl.bindFramebuffer(gl.FRAMEBUFFER, fluidFbo[1]);
const fluidFbo1OK = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;

let fluidRead = 0;
let fluidWrite = 1;
const fluidEnabled = fluidFbo0OK && fluidFbo1OK;
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2.25);
  const rect = canvas.getBoundingClientRect();
  const width = Math.max(1, Math.round(rect.width * dpr));
  const height = Math.max(1, Math.round(rect.height * dpr));

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
}

resize();
window.addEventListener('resize', resize, { passive: true });

const start = performance.now();

function stepFluid(t){
  if (!fluidEnabled) return;

  gl.useProgram(simProgram);
  bindQuad(simProgram);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fluidFbo[fluidWrite]);
  gl.viewport(0, 0, SIM_W, SIM_H);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fluidTex[fluidRead]);
  gl.uniform1i(simUPrev, 0);
  gl.uniform2f(simUSimRes, SIM_W, SIM_H);
  gl.uniform1f(simUTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  const tmp = fluidRead;
  fluidRead = fluidWrite;
  fluidWrite = tmp;
}

if (fluidEnabled) {
  for (let i = 0; i < prewarmSteps; i++) {
    stepFluid(startTimeOffset + i * prewarmStepSize);
  }
}

let logoAnimationStopped = false;

function stopLogoAnimation(){
  if (logoAnimationStopped) return;
  logoAnimationStopped = true;
  window.removeEventListener('resize', resize);
  fluidTex.forEach(texture => gl.deleteTexture(texture));
  fluidFbo.forEach(framebuffer => gl.deleteFramebuffer(framebuffer));
  gl.deleteBuffer(buffer);
  gl.deleteProgram(simProgram);
  gl.deleteProgram(renderProgram);
  canvas.remove();
  document.getElementById('bevel')?.remove();
}

function render(now){
  if (logoAnimationStopped) return;
  const t = startTimeOffset + (now - start) * 0.0030;

  stepFluid(t);

  gl.useProgram(renderProgram);
  bindQuad(renderProgram);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fluidTex[fluidRead]);
  gl.uniform1i(uFluid, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(render);
}

window.stopLogoAnimation = stopLogoAnimation;
requestAnimationFrame(render);
} catch (error) {
  canvas.remove();
  document.getElementById('bevel')?.remove();
  window.stopLogoAnimation = () => {};
}
} else {
  canvas.remove();
  document.getElementById('bevel')?.remove();
  window.stopLogoAnimation = () => {};
}

function loadYouTubeAPI() {
  if (window.YT?.Player) return Promise.resolve(true);
  if (apiPromise) return apiPromise;
  apiPromise = new Promise(resolve => {
    let settled = false;
    const finish = available => {
      if (settled) return;
      settled = true;
      window.clearTimeout(timeout);
      resolve(available);
    };
    const timeout = window.setTimeout(() => finish(false), 7000);
    const previousReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      finish(Boolean(window.YT?.Player));
      if (typeof previousReady === 'function') {
        try { previousReady(); } catch (error) { /* Another script's callback must not block this player. */ }
      }
    };
    const script = document.createElement('script');
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => finish(false);
    document.head.append(script);
  });
  return apiPromise;
}

  const card = image.getBoundingClientRect();
  const frame = playerFrame.getBoundingClientRect();
  const ratio = Number(image.getAttribute('width')) / Number(image.getAttribute('height'));
  const width = Math.min(frame.width, frame.height * ratio);
  const height = width / ratio;
  const full = {left:frame.left + (frame.width - width) / 2,top:frame.top + (frame.height - height) / 2,width,height};
  const clone = image.cloneNode();
  clone.className = 'launch-image';
  clone.alt = '';
  clone.setAttribute('aria-hidden', 'true');
  Object.assign(clone.style, {left:`${card.left}px`,top:`${card.top}px`,width:`${card.width}px`,height:`${card.height}px`});
  playerFrame.append(clone);
  launchImage = clone;
  const translateX = full.left - card.left;
  const translateY = full.top - card.top;
  const scale = full.width / card.width;
  const moveAnimation = clone.animate([
    {transform:'translate3d(0,0,0) scale(1)'},
    {transform:`translate3d(${translateX}px,${translateY}px,0) scale(${scale})`}
  ], {duration:LAUNCH_MOVE_MS,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
  const fadeAnimation = clone.animate([
    {opacity:1},
    {opacity:0}

  return Promise.allSettled([moveAnimation.finished, fadeAnimation.finished]).then(() => {

            if (playRequested) {
              event.target.unMute();
              event.target.setVolume(100);

            event.target.cueVideoById(activeFilm.dataset.video);
            disableCaptions(event.target);
            armReadinessTimeout(loadVersion);

            loadFallback(activeFilm, loadVersion);

      onStateChange(event) {

          markPlayerCued(loadVersion);

          if (playRequested) {
            try {
              event.target.unMute();
              event.target.setVolume(100);

          markFrameReady(loadVersion);
          videoPlayer.classList.remove('awaiting-play');
          playButton.classList.remove('is-visible');

      },
      onAutoplayBlocked(event) {
        if (event.target !== youtubePlayer) return;
        showPlayPrompt(loadVersion);
        markFrameReady(loadVersion);

  } catch (error) {

    youtubeReady = false;

function loadVideo(film) {

      youtubePlayer.cueVideoById(film.dataset.video);
      disableCaptions(youtubePlayer);
      armReadinessTimeout(version);
    } catch (error) {
      loadFallback(film, version);

  if (youtubePlayer) return;
  if (fallbackMode) {

  if (playerStarting) return;

function createVideoIframe(src = null) {
  const iframe = document.createElement('iframe');

  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.allowFullscreen = true;
  if (src) iframe.src = src;
  return iframe;
}

function replaceVideoIframe(src = null, onLoad = null) {

  videoPlayer.remove();
  videoPlayer = createVideoIframe(src);
  if (onLoad) videoPlayer.addEventListener('load', onLoad, {once:true});
  playerFrame.insertBefore(videoPlayer, loadingIndicator);
}

function filmFromURL() {
  const params = new URL(location.href).searchParams;
  return filmsBySlug.get(params.get('music') || params.get('video')) || null;
}

function musicURL(film) {
  const url = new URL(location.href);
  url.searchParams.delete('video');
  if (film) url.searchParams.set('music', film.dataset.slug);
  else url.searchParams.delete('music');
  return url;
}

function updateMusicURL(film, method) {
  const url = musicURL(film);
  const state = method === 'pushState' ? {apokalisMusic:film.dataset.slug, apokalisFromGallery:true} : history.state;
  history[method](state, '', url);
}

function commitMusicHistory(version) {
  if (version !== pendingHistoryVersion || !activeFilm) return;
  const mode = pendingHistoryMode;
  pendingHistoryMode = 'none';
  if (mode === 'push') {
    updateMusicURL(activeFilm, 'pushState');
  } else if (mode === 'direct') {
    const linkedURL = musicURL(activeFilm);
    history.replaceState({apokalisGallery:true}, '', musicURL(null));
    history.pushState({apokalisMusic:activeFilm.dataset.slug, apokalisFromGallery:true}, '', linkedURL);
  }
}

function openVideo(film, event = null, {historyMode = 'push', animateThumbnail = true} = {}) {
  if (playerStage.classList.contains('is-open')) return;
  window.clearTimeout(unloadTimer);
  lastSelectedFilm = film;
  openedWithKeyboard = event?.detail === 0;
  pendingHistoryVersion = loadVersion + 1;
  pendingHistoryMode = historyMode;
  resetPlayPrompt();
  updateReleaseLinks(film);
  playerStage.classList.remove('is-closing');
  playerStage.classList.add('is-open');
  playerStage.setAttribute('aria-hidden', 'false');
  galleryGrid.classList.add('is-leaving');
  document.body.classList.add('player-active');
  logo.setAttribute('role', 'button');
  logo.setAttribute('aria-label', 'Close video and see all videos');
  logo.tabIndex = 0;
  gallery.inert = true;
  document.body.style.overflow = 'hidden';
  loadVideo(film);
  const version = loadVersion;
  setLoadingVisible(false);
  const loaderDelay = animateThumbnail ? ANIMATED_LOADER_DELAY_MS : DIRECT_LOADER_DELAY_MS;
  loaderDelayTimer = window.setTimeout(() => {
    if (version !== loadVersion || frameReadyVersion === version || !playerStage.classList.contains('is-open')) return;
    setLoadingVisible(true);
  }, loaderDelay);
  (animateThumbnail ? launchThumbnail(film) : Promise.resolve()).then(() => {
    if (version !== loadVersion || !playerStage.classList.contains('is-open')) return;
    loadingPhaseDoneVersion = version;
    maybeStartPlayback(version);
    maybeShowFrame(version);
  });
  if (openedWithKeyboard) logo.focus({preventScroll:true});
}

function closeVideo(updateUrl = true) {
  if (!playerStage.classList.contains('is-open')) return;
  pendingHistoryMode = 'none';
  if (updateUrl) updateMusicURL(null, 'replaceState');
  document.title = 'APOKALIS';
  document.body.classList.add('logo-settling', 'logo-settled', 'gallery-revealed', 'intro-complete');
  activeFilm.scrollIntoView({block:'center',behavior:'auto'});
  clearLaunchImage();
  resetReleaseLinks();
  clearCaptionResets();
  playButton.classList.remove('is-visible');
  loadVersion++;
  window.clearTimeout(readinessTimer);
  window.clearTimeout(loaderDelayTimer);
  videoPlayer.classList.remove('is-ready', 'awaiting-play');
  loadingIndicator.classList.remove('has-error');
  setLoadingVisible(false);
  playerStage.classList.add('is-closing');
  playerStage.classList.remove('is-open');
  playerStage.setAttribute('aria-hidden', 'true');
  playerStarting = false;
  if (youtubeReady && youtubePlayer) {
    try { youtubePlayer.stopVideo(); } catch (error) { /* The iframe is removed after the gallery returns. */ }
  }
  document.body.classList.remove('player-active');
  logo.setAttribute('role', 'img');
  logo.setAttribute('aria-label', 'APOKALIS');
  logo.removeAttribute('tabindex');
  logo.blur();
  showFilms(activeFilm);
  gallery.inert = false;
  document.body.style.overflow = '';
  if (openedWithKeyboard) lastSelectedFilm?.focus({preventScroll:true});
  window.clearTimeout(unloadTimer);
  unloadTimer = window.setTimeout(() => replaceVideoIframe(), 150);
}

function returnToGallery() {
  if (!playerStage.classList.contains('is-open')) return;
  if (history.state?.apokalisFromGallery && history.state.apokalisMusic === activeFilm.dataset.slug) {
    closeVideo(false);
    history.back();
  } else {
    closeVideo();
  }
}

function startIntroSequence() {
  const linkedFilm = filmFromURL();
  if (linkedFilm && new URL(location.href).searchParams.has('video')) {
    history.replaceState(history.state, '', musicURL(linkedFilm));
  } else if (!linkedFilm) {
    history.replaceState({apokalisGallery:true}, '', musicURL(null));
  }
  window.setTimeout(() => {
    const currentLinkedFilm = filmFromURL();
    if (currentLinkedFilm) {
      document.body.classList.add('logo-settled', 'intro-complete');
      openVideo(currentLinkedFilm, null, {historyMode:'direct', animateThumbnail:false});
      window.setTimeout(() => window.stopLogoAnimation?.(), 7200);
      return;
    }
    document.body.classList.add('logo-settling', 'logo-settled', 'gallery-revealed');
    showFilms();
    window.setTimeout(() => {
      document.body.classList.add('intro-complete');
      gallery.inert = false;
    }, 1200);
    window.setTimeout(() => window.stopLogoAnimation?.(), 7200);
  }, INTRO_HOLD_MS);
}

films.forEach((film, index) => {
  film.style.setProperty('--order', index);
  film.addEventListener('click', event => openVideo(film, event));
});
playButton.addEventListener('click', startPlayback);
scheduleMasonry();
window.addEventListener('resize', scheduleMasonry, { passive:true });
logo.addEventListener('click', returnToGallery);
logo.addEventListener('keydown', event => {
  if (playerStage.classList.contains('is-open') && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    returnToGallery();
  }
});
window.addEventListener('popstate', () => {
  const linkedFilm = filmFromURL();
  if (linkedFilm) {
    if (playerStage.classList.contains('is-open') && activeFilm === linkedFilm) return;
    if (playerStage.classList.contains('is-open')) closeVideo(false);
    if (document.body.classList.contains('intro-complete')) {
      openVideo(linkedFilm, null, {historyMode:'none', animateThumbnail:false});
    }
  } else if (playerStage.classList.contains('is-open')) {
    closeVideo(false);
  }
});
window.addEventListener('load', startIntroSequence, { once:true });
loadYouTubeAPI();
</script>
